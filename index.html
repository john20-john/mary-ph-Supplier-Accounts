<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول قوائم الأدوية إلى صور مع الكميات</title>
    <style>
        * { box-sizing: border-box; font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: #1e3a8a; margin-top: 0; font-size: 24px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; font-size: 15px; }
        input[type="text"], textarea, input[type="number"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: all 0.3s; background-color: #f8fafc; }
        textarea { height: 150px; resize: vertical; }
        .btn-container { text-align: center; margin: 25px 0 15px 0; }
        .main-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px 35px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; max-width: 400px; }
        .success-btn { background: linear-gradient(135deg, #16a34a, #15803d); }
        
        #quantity-section { display: none; margin-top: 30px; border-top: 2px dashed #cbd5e1; padding-top: 20px; }
        .qty-table { width: 100%; border-collapse: collapse; }
        .qty-table th, .qty-table td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        
        .item-row { display: flex; align-items: center; gap: 15px; padding: 5px; transition: background 0.3s; border-radius: 6px; }
        .qty-input { width: 70px !important; text-align: center; color: #b91c1c; font-weight: bold; }
        .item-name-cell { flex-grow: 1; font-weight: bold; }
        
        .active-row { background-color: #fef9c3; border: 1px solid #fde047; }

        #output-container { margin-top: 30px; display: flex; flex-direction: column; gap: 35px; align-items: center; }
        .page-card { background: #fff; padding: 20px; border: 2px solid #cbd5e1; border-radius: 12px; width: 100%; max-width: 840px; text-align: center; }
        .page-card img { max-width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 15px; }
        .stats { text-align: center; color: #475569; font-weight: bold; padding: 10px; background: #f1f5f9; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>💊 محول قوائم الأدوية (الكميات بجانب الأصناف)</h1>
    
    <div class="input-group">
        <label for="pharmacy-name">عنوان الصورة:</label>
        <input type="text" id="pharmacy-name" value="قائمة النواقص والطلبيات اليومية">
    </div>

    <div class="input-group">
        <label for="input-list">1. الصق القائمة هنا:</label>
        <textarea id="input-list" placeholder="صنف 1&#10;صنف 2..."></textarea>
    </div>

    <div class="btn-container">
        <button class="main-btn" onclick="prepareQuantityInput()">✍️ 2. تحديد الكميات</button>
    </div>

    <div id="quantity-section">
        <table class="qty-table">
            <tbody id="qty-tbody"></tbody>
        </table>
        <div class="btn-container">
            <button id="generate-final-btn" class="main-btn success-btn" onclick="generateImages()">🎨 3. تحويل إلى صور</button>
        </div>
    </div>

    <div id="stats" class="stats"></div>
    <div id="output-container"></div>
</div>

<script>
let itemsData = [];

function prepareQuantityInput() {
    const text = document.getElementById('input-list').value.trim();
    const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
    if (lines.length === 0) return alert('برجاء لصق القائمة أولاً!');
    itemsData = lines;
    const tbody = document.getElementById('qty-tbody');
    tbody.innerHTML = '';
    itemsData.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td>
                <div class="item-row" id="row-${index}">
                    <span class="item-name-cell">${item}</span>
                    <input type="number" class="qty-input" id="qty-${index}" placeholder="الكمية" min="1" onfocus="highlightRow(${index})">
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById('quantity-section').style.display = 'block';
    setupEnterKeyNavigation();
    document.getElementById('qty-0').focus();
    highlightRow(0);
}

function highlightRow(index) {
    document.querySelectorAll('.item-row').forEach(row => row.classList.remove('active-row'));
    document.getElementById(`row-${index}`).classList.add('active-row');
}

function setupEnterKeyNavigation() {
    const inputs = document.querySelectorAll('.qty-input');
    inputs.forEach((input, index) => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const nextInput = document.getElementById(`qty-${index + 1}`);
                if (nextInput) { nextInput.focus(); nextInput.select(); }
                else { document.getElementById('generate-final-btn').focus(); }
            }
        });
    });
}

function generateImages() {
    const container = document.getElementById('output-container');
    container.innerHTML = '';
    const finalItems = itemsData.map((item, index) => ({ name: item, qty: document.getElementById(`qty-${index}`).value }));
    const pharmacyName = document.getElementById('pharmacy-name').value;
    const chunkSize = 25;

    for (let i = 0; i < finalItems.length; i += chunkSize) {
        const chunk = finalItems.slice(i, i + chunkSize);
        const canvas = document.createElement('canvas');
        canvas.width = 800; canvas.height = 1150;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 800, 1150);
        ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, 800, 95);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Tahoma'; ctx.textAlign = 'center';
        ctx.fillText(pharmacyName, 400, 45);
        
        let y = 150;
        chunk.forEach((itemObj, index) => {
            ctx.fillStyle = '#0f172a'; ctx.font = '16px Tahoma';
            ctx.textAlign = 'right';
            
            // اسم الصنف
            ctx.fillText(`${i + index + 1}. ${itemObj.name}`, 760, y);
            
            // الكمية (مباشرة بعد الاسم بلون أحمر)
            if(itemObj.qty) {
                ctx.fillStyle = '#b91c1c'; 
                ctx.font = 'bold 18px Tahoma';
                ctx.fillText(`— [${itemObj.qty}]`, 150, y);
            }
            y += 36;
        });

        const img = document.createElement('img');
        img.src = canvas.toDataURL();
        const card = document.createElement('div'); card.className = 'page-card';
        card.appendChild(img);
        container.appendChild(card);
    }
}
</script>
</body>
</html>
